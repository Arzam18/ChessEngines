import java.net.URL

plugins {
    id 'com.android.application'
}

final String calvinNetworkName = 'calvin1024_8b.nnue'
final String calvinNetworkUrl = 'https://raw.githubusercontent.com/kelseyde/calvin-chess-engine/main/src/main/resources/calvin1024_8b.nnue'
// Required NNUE tensor payload: 8 buckets * (768 * 1024 input weights)
// + 1024 input biases + 2048 output weights + 1 output bias, all int16.
// The upstream asset may contain additional trailing bytes.
final long calvinNetworkPayloadBytes = (8L * 768L * 1024L + 1024L + 2048L + 1L) * 2L
final String calvinNdkVersion = '27.2.12479018'

def calvinAssetsDir = layout.buildDirectory.dir('generated/calvinAssets')
def calvinNetworkFile = calvinAssetsDir.map { it.file(calvinNetworkName) }
def calvinOexJniDir = layout.buildDirectory.dir('generated/calvinOexJniLibs')
def calvinLauncherBinary = calvinOexJniDir.map { it.file('arm64-v8a/libcalvin.so') }
def calvinLauncherRawBinary = layout.buildDirectory.file('generated/calvinLauncher/calvin-launcher.raw')
def calvinLauncherSource = file('src/main/cpp/calvin_bridge.c')
def calvinNeonBinary = layout.buildDirectory.file('generated/calvinRuntime/libcalvinneon.so')
def calvinNeonSource = file('src/main/cpp/calvin_neon.c')
def calvinEmbeddedDexDir = layout.buildDirectory.dir('generated/calvinRuntime/dex')
def calvinProjectDexDir = layout.buildDirectory.dir('intermediates/dex/debug/mergeProjectDexDebug')
def calvinExternalDexDir = layout.buildDirectory.dir('intermediates/dex/debug/mergeExtDexDebug')

tasks.register('downloadCalvinNetwork') {
    group = 'build setup'
    description = 'Downloads the official Calvin NNUE network as a standalone runtime payload input.'
    outputs.file(calvinNetworkFile)
    outputs.upToDateWhen {
        File file = calvinNetworkFile.get().asFile
        file.isFile() && file.length() >= calvinNetworkPayloadBytes
    }
    doLast {
        File target = calvinNetworkFile.get().asFile
        if (target.isFile() && target.length() >= calvinNetworkPayloadBytes) {
            logger.lifecycle("Calvin NNUE already downloaded: ${target.length()} bytes")
            return
        }

        target.parentFile.mkdirs()
        File temporary = new File(target.parentFile, target.name + '.download')
        URL url = new URL(calvinNetworkUrl)
        def connection = url.openConnection()
        connection.connectTimeout = 30000
        connection.readTimeout = 120000
        connection.setRequestProperty('User-Agent', 'ChessEngines-Calvin-Android-Gradle')
        connection.connect()

        connection.getInputStream().withCloseable { input ->
            temporary.withOutputStream { output ->
                byte[] buffer = new byte[64 * 1024]
                int count
                while ((count = input.read(buffer)) != -1) {
                    output.write(buffer, 0, count)
                }
            }
        }

        long downloadedBytes = temporary.isFile() ? temporary.length() : 0L
        if (!temporary.isFile() || downloadedBytes < calvinNetworkPayloadBytes) {
            temporary.delete()
            throw new GradleException(
                "Downloaded Calvin NNUE is truncated (${downloadedBytes} bytes; " +
                "expected at least ${calvinNetworkPayloadBytes}). URL: ${calvinNetworkUrl}"
            )
        }

        if (downloadedBytes > calvinNetworkPayloadBytes) {
            logger.lifecycle(
                "Calvin NNUE contains ${downloadedBytes - calvinNetworkPayloadBytes} " +
                'additional trailing bytes; the runtime will use the required tensor payload.'
            )
        }

        if (target.exists() && !target.delete()) {
            temporary.delete()
            throw new GradleException("Cannot replace existing generated NNUE file: ${target}")
        }
        if (!temporary.renameTo(target)) {
            temporary.delete()
            throw new GradleException("Cannot move generated NNUE file into assets: ${target}")
        }
        logger.lifecycle("Downloaded Calvin NNUE (${target.length()} bytes)")
    }
}

/**
 * Build the standalone ARM64 Android PIE launcher. OEX executes it as the
 * engine process; it then starts ART and Calvin Java in the same child process.
 */
tasks.register('buildCalvinLauncher', Exec) {
    group = 'build setup'
    description = 'Builds the standalone ARM64 OEX executable that bootstraps Calvin Java through ART.'
    inputs.file(calvinLauncherSource)
    outputs.file(calvinLauncherRawBinary)

    doFirst {
        String sdkRoot = System.getenv('ANDROID_SDK_ROOT') ?: System.getenv('ANDROID_HOME')
        if (sdkRoot == null || sdkRoot.trim().isEmpty()) {
            throw new GradleException('ANDROID_SDK_ROOT/ANDROID_HOME is not set; install the Android SDK and NDK.')
        }
        String ndkRoot = System.getenv('ANDROID_NDK_HOME')
        if (ndkRoot == null || ndkRoot.trim().isEmpty()) {
            ndkRoot = new File(sdkRoot, "ndk/${calvinNdkVersion}").absolutePath
        }

        String hostTag = 'linux-x86_64'
        String osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
        if (osName.contains('win')) hostTag = 'windows-x86_64'
        else if (osName.contains('mac')) hostTag = 'darwin-x86_64'

        String compilerName = osName.contains('win')
            ? 'aarch64-linux-android21-clang.cmd'
            : 'aarch64-linux-android21-clang'
        File compiler = new File(ndkRoot,
            "toolchains/llvm/prebuilt/${hostTag}/bin/${compilerName}")
        if (!compiler.isFile()) {
            throw new GradleException("Android NDK compiler not found: ${compiler}. " +
                "Install NDK ${calvinNdkVersion} or set ANDROID_NDK_HOME.")
        }

        File output = calvinLauncherRawBinary.get().asFile
        output.parentFile.mkdirs()
        commandLine compiler.absolutePath,
            '-std=c11', '-O2', '-fPIE', '-pie',
            '-Wl,--build-id=none',
            '-Wl,-z,relro,-z,now',
            '-Wl,-z,max-page-size=16384',
            '-Wl,-z,common-page-size=16384',
            calvinLauncherSource.absolutePath,
            '-o', output.absolutePath
    }
}

/**
 * Build a separate JNI shared library containing only the NNUE's ARM64 NEON
 * kernels. It is not an engine executable and is never registered with OEX.
 */
tasks.register('buildCalvinNeon', Exec) {
    group = 'build setup'
    description = 'Builds Calvin NNUE SCReLU and accumulator kernels for ARM64 NEON.'
    inputs.file(calvinNeonSource)
    outputs.file(calvinNeonBinary)

    doFirst {
        String sdkRoot = System.getenv('ANDROID_SDK_ROOT') ?: System.getenv('ANDROID_HOME')
        if (sdkRoot == null || sdkRoot.trim().isEmpty()) {
            throw new GradleException('ANDROID_SDK_ROOT/ANDROID_HOME is not set; install the Android SDK and NDK.')
        }
        String ndkRoot = System.getenv('ANDROID_NDK_HOME')
        if (ndkRoot == null || ndkRoot.trim().isEmpty()) {
            ndkRoot = new File(sdkRoot, "ndk/${calvinNdkVersion}").absolutePath
        }

        String hostTag = 'linux-x86_64'
        String osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
        if (osName.contains('win')) hostTag = 'windows-x86_64'
        else if (osName.contains('mac')) hostTag = 'darwin-x86_64'

        String compilerName = osName.contains('win')
            ? 'aarch64-linux-android21-clang.cmd'
            : 'aarch64-linux-android21-clang'
        File compiler = new File(ndkRoot,
            "toolchains/llvm/prebuilt/${hostTag}/bin/${compilerName}")
        if (!compiler.isFile()) {
            throw new GradleException("Android NDK compiler not found: ${compiler}. " +
                "Install NDK ${calvinNdkVersion} or set ANDROID_NDK_HOME.")
        }

        File output = calvinNeonBinary.get().asFile
        output.parentFile.mkdirs()
        commandLine compiler.absolutePath,
            '-std=c11', '-O3', '-fPIC', '-shared', '-march=armv8-a+simd',
            '-fvisibility=hidden',
            '-Wl,--build-id=none',
            '-Wl,-z,relro,-z,now',
            '-Wl,-z,max-page-size=16384',
            '-Wl,-soname,libcalvinneon.so',
            calvinNeonSource.absolutePath,
            '-o', output.absolutePath
    }
}


/**
 * OEX GUIs copy only the registered engine executable into their own private
 * engine directory. Embed a self-contained ART runtime into the executable so
 * it does not need to find or access the provider APK after that copy.
 *
 * AGP first dexes project classes and core-library-desugaring classes. D8 then
 * merges those DEX inputs into one standalone classes.dex. The launcher appends
 * that DEX, the exact NNUE asset and the NEON JNI library to its PIE file.
 */
tasks.register('embedCalvinRuntime') {
    group = 'build setup'
    description = 'Embeds Calvin DEX, NNUE and NEON runtime into the OEX executable.'
    dependsOn(tasks.named('buildCalvinLauncher'))
    dependsOn(tasks.named('buildCalvinNeon'))
    dependsOn(tasks.named('downloadCalvinNetwork'))
    dependsOn(tasks.matching { it.name == 'mergeProjectDexDebug' })
    dependsOn(tasks.matching { it.name == 'mergeExtDexDebug' })
    inputs.file(calvinLauncherRawBinary)
    inputs.file(calvinNetworkFile)
    inputs.file(calvinNeonBinary)
    inputs.dir(calvinProjectDexDir)
    inputs.dir(calvinExternalDexDir)
    outputs.file(calvinLauncherBinary)

    doLast {
        File sdkRootFile = new File(System.getenv('ANDROID_SDK_ROOT') ?: System.getenv('ANDROID_HOME') ?: '')
        if (!sdkRootFile.isDirectory()) {
            throw new GradleException('ANDROID_SDK_ROOT/ANDROID_HOME is not set.')
        }
        File d8 = new File(sdkRootFile, 'build-tools/35.0.0/d8')
        if (!d8.isFile()) {
            throw new GradleException("D8 not found: ${d8}. Install Android Build Tools 35.0.0.")
        }

        List<File> dexInputs = []
        [calvinProjectDexDir.get().asFile, calvinExternalDexDir.get().asFile].each { directory ->
            if (directory.isDirectory()) {
                dexInputs.addAll(fileTree(directory).matching { include '**/*.dex' }.files)
            }
        }
        dexInputs = dexInputs.unique { it.canonicalPath }.sort { it.canonicalPath }
        if (dexInputs.isEmpty()) {
            throw new GradleException('AGP project/external DEX outputs are missing; cannot create standalone Calvin runtime.')
        }

        File dexOutputDir = calvinEmbeddedDexDir.get().asFile
        delete(dexOutputDir)
        dexOutputDir.mkdirs()
        File androidJar = new File(sdkRootFile, 'platforms/android-35/android.jar')
        if (!androidJar.isFile()) {
            throw new GradleException("Android platform API jar not found: ${androidJar}. Install platforms;android-35.")
        }
        logger.lifecycle("Merging ${dexInputs.size()} AGP DEX input(s) into the standalone Calvin runtime")
        project.exec {
            commandLine([d8.absolutePath, '--release', '--min-api', '21',
                         '--lib', androidJar.absolutePath,
                         '--output', dexOutputDir.absolutePath] + dexInputs.collect { it.absolutePath })
        }
        List<File> mergedDexFiles = fileTree(dexOutputDir).matching { include '**/*.dex' }.files.toList()
        if (mergedDexFiles.size() != 1 || mergedDexFiles[0].name != 'classes.dex') {
            throw new GradleException("Expected one standalone DEX file, found: ${mergedDexFiles*.name}. " +
                'Review D8 multidex output before packaging; it must not silently omit Calvin classes.')
        }

        File rawLauncher = calvinLauncherRawBinary.get().asFile
        File network = calvinNetworkFile.get().asFile
        File neon = calvinNeonBinary.get().asFile
        File finalLauncher = calvinLauncherBinary.get().asFile
        [rawLauncher, network, neon, mergedDexFiles[0]].each { input ->
            if (!input.isFile() || input.length() <= 0L) {
                throw new GradleException("Missing/empty Calvin runtime component: ${input}")
            }
        }
        if (network.length() < calvinNetworkPayloadBytes) {
            throw new GradleException("Calvin NNUE payload is truncated: ${network.length()} bytes")
        }

        finalLauncher.parentFile.mkdirs()
        if (finalLauncher.exists() && !finalLauncher.delete()) {
            throw new GradleException("Cannot replace final OEX launcher: ${finalLauncher}")
        }
        finalLauncher.withOutputStream { output ->
            rawLauncher.withInputStream { input -> input.transferTo(output) }
            mergedDexFiles[0].withInputStream { input -> input.transferTo(output) }
            network.withInputStream { input -> input.transferTo(output) }
            neon.withInputStream { input -> input.transferTo(output) }
            // The native launcher reads this little-endian footer from EOF.
            output.write(([67, 86, 82, 84, 48, 48, 49, 0] as byte[]))
            [mergedDexFiles[0].length(), network.length(), neon.length()].each { long value ->
                for (int index = 0; index < 8; index++) {
                    output.write((int) ((value >>> (index * 8)) & 0xffL))
                }
            }
        }
        logger.lifecycle("Embedded standalone Calvin runtime: DEX=${mergedDexFiles[0].length()} bytes, " +
            "NNUE=${network.length()} bytes, NEON=${neon.length()} bytes")
    }
}

android {
    namespace 'ccc.chess.engines'
    compileSdk 35
    ndkVersion calvinNdkVersion

    defaultConfig {
        applicationId 'ccc.chess.engines'
        // ARM64 Android devices have API level 21 or newer.
        minSdk 21
        targetSdk 29
        versionCode 23
        versionName '2.8.1-calvin-oex'
        multiDexEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    sourceSets {
        main {
            // The standalone launcher contains the DEX, NNUE and NEON payload;
            // only this one OEX PIE executable is installed as a native payload.
            jniLibs.setSrcDirs([calvinOexJniDir])
        }
    }

    packaging {
        jniLibs {
            // OEX opens the executable from ApplicationInfo.nativeLibraryDir.
            // Preserve appended DEX/NNUE/NEON payload bytes: AGP must not strip
            // or rewrite this executable as if it were an ordinary JNI library.
            keepDebugSymbols += ['**/libcalvin.so']
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('downloadCalvinNetwork'))
}

// DEX merge is independent of native-library merge. The latter must wait for
// the DEX/network/NEON payload to be appended to the raw launcher.
tasks.matching { it.name == 'mergeDebugNativeLibs' }.configureEach {
    dependsOn(tasks.named('embedCalvinRuntime'))
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
