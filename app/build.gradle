import java.net.URL

plugins {
    id 'com.android.application'
}

final String calvinNetworkName = 'calvin1024_8b.nnue'
final String calvinNetworkUrl = 'https://raw.githubusercontent.com/kelseyde/calvin-chess-engine/main/src/main/resources/calvin1024_8b.nnue'
// Required NNUE tensor payload: 8 buckets * (768 * 1024 input weights)
// + 1024 input biases + 2048 output weights + 1 output bias, all int16.
// The upstream asset may contain additional trailing bytes.
final long calvinNetworkPayloadBytes = (8L * 768L * 1024L + 1024L + 2048L + 1L) * 2L
final String calvinNdkVersion = '27.2.12479018'

def calvinAssetsDir = layout.buildDirectory.dir('generated/calvinAssets')
def calvinNetworkFile = calvinAssetsDir.map { it.file(calvinNetworkName) }
def calvinBridgeJniDir = layout.buildDirectory.dir('generated/calvinBridgeJniLibs')
def calvinBridgeBinary = calvinBridgeJniDir.map { it.file('arm64-v8a/libcalvinbridge.so') }
def calvinBridgeSource = file('src/main/cpp/calvin_bridge.c')

tasks.register('downloadCalvinNetwork') {
    group = 'build setup'
    description = 'Downloads the official Calvin NNUE network into generated Android assets.'
    outputs.file(calvinNetworkFile)
    outputs.upToDateWhen {
        File file = calvinNetworkFile.get().asFile
        file.isFile() && file.length() >= calvinNetworkPayloadBytes
    }
    doLast {
        File target = calvinNetworkFile.get().asFile
        if (target.isFile() && target.length() >= calvinNetworkPayloadBytes) {
            logger.lifecycle("Calvin NNUE already downloaded: ${target.length()} bytes")
            return
        }

        target.parentFile.mkdirs()
        File temporary = new File(target.parentFile, target.name + '.download')
        URL url = new URL(calvinNetworkUrl)
        def connection = url.openConnection()
        connection.connectTimeout = 30000
        connection.readTimeout = 120000
        connection.setRequestProperty('User-Agent', 'ChessEngines-Calvin-Android-Gradle')
        connection.connect()

        connection.getInputStream().withCloseable { input ->
            temporary.withOutputStream { output ->
                byte[] buffer = new byte[64 * 1024]
                int count
                while ((count = input.read(buffer)) != -1) {
                    output.write(buffer, 0, count)
                }
            }
        }

        long downloadedBytes = temporary.isFile() ? temporary.length() : 0L
        if (!temporary.isFile() || downloadedBytes < calvinNetworkPayloadBytes) {
            temporary.delete()
            throw new GradleException(
                "Downloaded Calvin NNUE is truncated (${downloadedBytes} bytes; " +
                "expected at least ${calvinNetworkPayloadBytes}). URL: ${calvinNetworkUrl}"
            )
        }

        if (downloadedBytes > calvinNetworkPayloadBytes) {
            logger.lifecycle(
                "Calvin NNUE contains ${downloadedBytes - calvinNetworkPayloadBytes} " +
                'additional trailing bytes; the runtime will use the required tensor payload.'
            )
        }

        if (target.exists() && !target.delete()) {
            temporary.delete()
            throw new GradleException("Cannot replace existing generated NNUE file: ${target}")
        }
        if (!temporary.renameTo(target)) {
            temporary.delete()
            throw new GradleException("Cannot move generated NNUE file into assets: ${target}")
        }
        logger.lifecycle("Downloaded Calvin NNUE (${target.length()} bytes)")
    }
}

/**
 * Build one ARM64 Android PIE executable. It is deliberately emitted into a
 * generated jniLibs directory, separate from the original OEX native engines.
 */
tasks.register('buildCalvinBridge', Exec) {
    group = 'build setup'
    description = 'Builds the tiny ARM64 UCI relay executable used by the OEX provider.'
    inputs.file(calvinBridgeSource)
    outputs.file(calvinBridgeBinary)

    doFirst {
        String sdkRoot = System.getenv('ANDROID_SDK_ROOT') ?: System.getenv('ANDROID_HOME')
        if (sdkRoot == null || sdkRoot.trim().isEmpty()) {
            throw new GradleException('ANDROID_SDK_ROOT/ANDROID_HOME is not set; install the Android SDK and NDK.')
        }
        String ndkRoot = System.getenv('ANDROID_NDK_HOME')
        if (ndkRoot == null || ndkRoot.trim().isEmpty()) {
            ndkRoot = new File(sdkRoot, "ndk/${calvinNdkVersion}").absolutePath
        }

        String hostTag = 'linux-x86_64'
        String osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
        if (osName.contains('win')) hostTag = 'windows-x86_64'
        else if (osName.contains('mac')) hostTag = 'darwin-x86_64'

        String compilerName = osName.contains('win')
            ? 'aarch64-linux-android21-clang.cmd'
            : 'aarch64-linux-android21-clang'
        File compiler = new File(ndkRoot,
            "toolchains/llvm/prebuilt/${hostTag}/bin/${compilerName}")
        if (!compiler.isFile()) {
            throw new GradleException("Android NDK compiler not found: ${compiler}. " +
                "Install NDK ${calvinNdkVersion} or set ANDROID_NDK_HOME.")
        }

        File output = calvinBridgeBinary.get().asFile
        output.parentFile.mkdirs()
        commandLine compiler.absolutePath,
            '-std=c11', '-O2', '-fPIE', '-pie',
            '-Wl,--build-id=none',
            '-Wl,-z,relro,-z,now',
            '-Wl,-z,max-page-size=16384',
            '-Wl,-z,common-page-size=16384',
            calvinBridgeSource.absolutePath,
            '-o', output.absolutePath
    }
}

android {
    namespace 'ccc.chess.engines'
    compileSdk 35
    ndkVersion calvinNdkVersion

    defaultConfig {
        applicationId 'ccc.chess.engines'
        // ARM64 Android devices have API level 21 or newer.
        minSdk 21
        targetSdk 29
        versionCode 23
        versionName '2.8.1-calvin-oex'
        multiDexEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    sourceSets {
        main {
            assets.srcDir(calvinAssetsDir)
            // Only the generated bridge is considered for packaging. Existing
            // root/native engine folders remain untouched and are bypassed.
            jniLibs.setSrcDirs([calvinBridgeJniDir])
        }
    }

    androidResources {
        noCompress += ['nnue']
    }

    packaging {
        jniLibs {
            // OEX opens the executable from ApplicationInfo.nativeLibraryDir.
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('downloadCalvinNetwork'))
    dependsOn(tasks.named('buildCalvinBridge'))
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
