name: Build Calvin OEX Standalone (ARM64)

# Manual-only build: commits and pull requests do not consume runner time.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform, build tools, and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Verify standalone OEX launcher architecture
        run: python3 scripts/verify_calvin_standalone_launcher.py

      - name: Compile launcher source with host warnings-as-errors
        run: cc -std=c11 -O2 -Wall -Wextra -Werror -fsyntax-only app/src/main/cpp/calvin_bridge.c

      - name: Test APK ZIP NNUE loader and trailing-byte handling
        run: bash ./scripts/test_network_zip_loader.sh

      - name: Test NNUE kernel arithmetic
        shell: bash
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            app/src/test/cpp/calvin_neon_kernel_test.c \
            -o /tmp/calvin-neon-kernel-test
          /tmp/calvin-neon-kernel-test

      - name: Build Calvin OEX APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify self-contained Calvin OEX executable
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mapfile -t NATIVE_LIBS < <(unzip -Z1 "$APK" | grep -E '^lib/[^/]+/[^/]+\.so$' | sort || true)
          printf 'Native payloads in APK:\n'
          printf '  %s\n' "${NATIVE_LIBS[@]}"
          if [[ "${#NATIVE_LIBS[@]}" -ne 1 \
              || "${NATIVE_LIBS[0]}" != "lib/arm64-v8a/libcalvin.so" ]]; then
            echo "ERROR: APK must contain only the self-contained ARM64 Calvin OEX PIE executable."
            exit 1
          fi
          unzip -p "$APK" lib/arm64-v8a/libcalvin.so > /tmp/libcalvin.so
          python3 scripts/extract_calvin_payload.py \
            --input /tmp/libcalvin.so --output-dir /tmp/calvin-runtime
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" -h /tmp/libcalvin.so | tee /tmp/calvin-elf-header.txt
          "$READELF" -h /tmp/calvin-runtime/libcalvinneon.so | tee /tmp/neon-elf-header.txt
          grep -q 'AArch64' /tmp/calvin-elf-header.txt
          grep -q 'DYN' /tmp/calvin-elf-header.txt
          grep -q 'AArch64' /tmp/neon-elf-header.txt
          grep -q 'DYN' /tmp/neon-elf-header.txt
          "$READELF" -l /tmp/libcalvin.so | grep -q '/system/bin/linker64'
          "$READELF" -Ws /tmp/calvin-runtime/libcalvinneon.so | grep -q 'Java_com_kelseyde_calvin_evaluation_CalvinNeon_screluForwardNative'
          "$READELF" -Ws /tmp/calvin-runtime/libcalvinneon.so | grep -q 'Java_com_kelseyde_calvin_evaluation_CalvinNeon_updateFeaturesNative'
          "$READELF" -Ws /tmp/calvin-runtime/libcalvinneon.so | grep -q 'Java_com_kelseyde_calvin_evaluation_CalvinNeon_updateBothFromPreviousNative'
          grep -a -q 'com/kelseyde/calvin/android/CalvinUciMain' /tmp/calvin-runtime/classes.dex
          echo "Verified: one self-contained ARM64 PIE OEX executable with DEX, NNUE and NEON embedded; original native chess engines are not packaged."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oex-calvin-standalone-arm64-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
