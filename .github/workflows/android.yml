name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build OEX + Calvin (Java/ART)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Download Calvin NNUE and build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists and inspect packaged native libraries
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
          if unzip -l "$APK" | grep -E 'lib/[^/]+/[^/]+\.so$'; then
            echo "Unexpected native shared library found in APK"
            exit 1
          fi
          echo "Verified: no native .so engine binaries are packaged."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oex-calvin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
