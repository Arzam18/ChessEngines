
name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Calvin-only OEX APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Verify native libraries are excluded
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if unzip -l "$APK" | grep -E 'lib/[^/]+/[^/]+\.so$'; then
            echo "::error::Native shared libraries were found in the APK."
            exit 1
          fi

          echo "Verified: No native .so libraries are packaged."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oex-calvin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
